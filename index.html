<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Generator</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #141416;
    --surface2: #1c1c20;
    --border: #2a2a30;
    --accent: #ff3333;
    --text: #f0f0f0;
    --muted: #666;
    --label: #888;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .sidebar-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex: 1;
  }

  .section-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .text-field {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.15s;
  }
  .text-field:focus { border-color: var(--accent); }

  /* Icon picker */
  .icon-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    position: relative;
    overflow: hidden;
  }
  .icon-btn:hover { border-color: #444; background: #222228; }
  .icon-btn.active { border-color: var(--accent); background: #ff333318; }
  .icon-btn canvas {
    transform: scale(4);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transform-origin: center center;
    pointer-events: none;
  }
  .icon-btn .icon-label {
    font-size: 9px;
    color: var(--muted);
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'Space Mono', monospace;
  }

  .icon-none-btn {
    width: 36px;
    height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--muted);
    transition: all 0.12s;
    font-family: 'Space Mono', monospace;
  }
  .icon-none-btn:hover { border-color: #444; }
  .icon-none-btn.active { border-color: var(--accent); color: var(--accent); background: #ff333318; }

  .icon-pos-toggle {
    display: flex;
    gap: 5px;
    margin-top: 6px;
  }
  .icon-pos-btn {
    flex: 1;
    padding: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--label);
    font-size: 0.72rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.12s;
    font-family: 'DM Sans', sans-serif;
  }
  .icon-pos-btn.active { background: #ff333318; border-color: var(--accent); color: var(--accent); }
  .icon-pos-btn:hover:not(.active) { border-color: #444; color: var(--text); }

  .dir-toggle {
    display: flex;
    gap: 6px;
  }
  .dir-btn {
    flex: 1;
    padding: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--label);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .dir-btn.active { background: #ff333318; border-color: var(--accent); color: var(--accent); }
  .dir-btn:hover:not(.active) { border-color: #444; color: var(--text); }

  .presets-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-swatch {
    width: 32px; height: 32px;
    border-radius: 5px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }
  .preset-swatch:hover { transform: scale(1.1); }
  .preset-swatch.active { border-color: white; }

  .color-section { display: flex; flex-direction: column; gap: 10px; }
  .color-row { display: flex; align-items: center; gap: 10px; }

  .color-dot-wrapper {
    position: relative;
    width: 28px; height: 28px;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid var(--border);
    flex-shrink: 0;
    transition: border-color 0.15s;
  }
  .color-dot-wrapper:hover { border-color: #555; }
  .color-dot-wrapper input[type="color"] {
    position: absolute;
    top: -5px; left: -5px;
    width: 40px; height: 40px;
    border: none; background: none;
    cursor: pointer;
    opacity: 0;
  }
  .color-dot-bg { position: absolute; inset: 0; pointer-events: none; }

  .color-info { flex: 1; display: flex; flex-direction: column; }
  .color-name { font-size: 0.75rem; color: var(--label); }
  .color-hex { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--text); }

  .gradient-strip-wrap {
    position: relative;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #gradient-strip { width: 100%; height: 100%; }

  .dl-btn {
    margin-top: auto;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: background 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .dl-btn:hover { background: #cc0000; }
  .dl-btn:active { transform: scale(0.98); }

  #preview-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, #1a1a1e 25%, transparent 25%),
      linear-gradient(-45deg, #1a1a1e 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1a1e 75%),
      linear-gradient(-45deg, transparent 75%, #1a1a1e 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    position: relative;
  }

  .preview-label {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #badge-canvas {
    transform: scale(12);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .size-info {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .divider { width: 100%; height: 1px; background: var(--border); }

  .padding-row { display: flex; align-items: center; gap: 10px; }
  .padding-label {
    font-size: 0.72rem;
    color: var(--label);
    width: 28px;
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
  }
  .padding-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .padding-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    transition: transform 0.1s;
  }
  .padding-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .padding-slider::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
  }
  .padding-value {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--text);
    width: 22px;
    text-align: right;
    flex-shrink: 0;
  }
</style>
 </head>
 <body>
  <div id="sidebar">
   <div class="sidebar-body">
    <div>
     <div class="section-label">Badge text</div>
     <input type="text" class="text-field" id="text-input" value="ADMIN" autocomplete="off">
    </div>
    <!-- ICON PICKER -->
    <div>
     <div class="section-label">Pixel icon</div>
     <div class="icon-picker" id="icon-picker">
      <div class="icon-none-btn active" id="icon-none" onclick="selectIcon(null, this)">none</div>
     </div>
     <div class="icon-pos-toggle" id="icon-pos-toggle" style="display:none;">
      <button class="icon-pos-btn active" onclick="setIconPos('left', this)">← Left</button>
      <button class="icon-pos-btn" onclick="setIconPos('right', this)">Right →</button>
     </div>
    </div>
    <div>
     <div class="section-label">Padding</div>
     <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="padding-row">
       <span class="padding-label">L</span> <input type="range" class="padding-slider" id="pad-left" min="1" max="20" value="4"> <span class="padding-value" id="pad-left-val">4</span>
      </div>
      <div class="padding-row">
       <span class="padding-label">R</span> <input type="range" class="padding-slider" id="pad-right" min="1" max="20" value="4"> <span class="padding-value" id="pad-right-val">4</span>
      </div>
      <div class="padding-row">
       <span class="padding-label">T</span> <input type="range" class="padding-slider" id="pad-top" min="0" max="10" value="2"> <span class="padding-value" id="pad-top-val">2</span>
      </div>
      <div class="padding-row">
       <span class="padding-label">B</span> <input type="range" class="padding-slider" id="pad-bottom" min="0" max="10" value="2"> <span class="padding-value" id="pad-bottom-val">2</span>
      </div>
     </div>
    </div>
    <div>
     <div class="section-label">Gradient direction</div>
     <div class="dir-toggle">
      <button class="dir-btn active" id="dir-tb" onclick="setDir('top-bottom', this)">↕ Horizontal</button>
      <button class="dir-btn" id="dir-lr" onclick="setDir('left-right', this)">↔ Vertical</button>
     </div>
    </div>
    <div>
     <div class="section-label">Gradient presets</div>
     <div class="presets-bar" id="presets-bar"></div>
    </div>
    <div>
     <div class="section-label">Gradient preview</div>
     <div class="gradient-strip-wrap">
      <canvas id="gradient-strip" height="14"></canvas>
     </div>
    </div>
    <div class="color-section">
     <div class="section-label">Colors</div>
     <div class="color-row">
      <div class="color-dot-wrapper">
       <div class="color-dot-bg" id="dot-top-bg"></div>
       <input type="color" id="bg-top" value="#ff3333">
      </div>
      <div class="color-info">
       <span class="color-name">Background — Start</span> <span class="color-hex" id="hex-top">#FF3333</span>
      </div>
     </div>
     <div class="color-row">
      <div class="color-dot-wrapper">
       <div class="color-dot-bg" id="dot-bot-bg"></div>
       <input type="color" id="bg-bottom" value="#cc0000">
      </div>
      <div class="color-info">
       <span class="color-name">Background — End</span> <span class="color-hex" id="hex-bot">#CC0000</span>
      </div>
     </div>
     <div class="divider"></div>
     <div class="color-row">
      <div class="color-dot-wrapper">
       <div class="color-dot-bg" id="dot-txt-bg"></div>
       <input type="color" id="text-color" value="#ffffff">
      </div>
      <div class="color-info">
       <span class="color-name">Text</span> <span class="color-hex" id="hex-txt">#FFFFFF</span>
      </div>
     </div>
     <div class="color-row">
      <div class="color-dot-wrapper">
       <div class="color-dot-bg" id="dot-shd-bg"></div>
       <input type="color" id="shadow-color" value="#5e0000">
      </div>
      <div class="color-info">
       <span class="color-name">Text shadow</span> <span class="color-hex" id="hex-shd">#5E0000</span>
      </div>
     </div>
    </div>
    <button class="dl-btn" id="download-btn">↓ Download PNG</button>
   </div>
  </div>
  <div id="preview-area">
   <span class="preview-label">Preview · 12× scale</span>
   <canvas id="badge-canvas"></canvas>
   <span class="size-info" id="size-info">— × — px</span>
  </div>
  <script>
const fontMap = {

  'A':['01110','10001','11111','10001','10001'],
  'B':['11110','10001','11110','10001','11110'],
  'C':['01110','10001','10000','10001','01110'],
  'D':['11110','10001','10001','10001','11110'],
  'E':['1111','1000','1110','1000','1111'],
  'F':['1111','1000','1110','1000','1000'],
  'G':['01110','10000','10111','10001','01110'],
  'H':['10001','10001','11111','10001','10001'],
  'I':['111','010','010','010','111'],
  'J':['00111','00001','00001','10001','01110'],
  'K':['10011','10100','11000','10100','10011'],
  'L':['1000','1000','1000','1000','1111'],
  'M':['10001','11011','10101','10001','10001'],
  'N':['10001','11001','10101','10011','10001'],
  'O':['01110','10001','10001','10001','01110'],
  'P':['11110','10001','11110','10000','10000'],
  'Q':['01110','10001','10001','10011','01111'],
  'R':['11110','10001','11110','10100','10011'],
  'S':['01111','10000','01110','00001','11110'],
  'T':['11111','00100','00100','00100','00100'],
  'U':['10001','10001','10001','10001','01110'],
  'V':['10001','10001','10001','01010','00100'],
  'W':['10001','10001','10101','11011','10001'],
  'X':['10001','01010','00100','01010','10001'],
  'Y':['10001','01010','00100','00100','00100'],
  'Z':['11111','00010','00100','01000','11111'],
  '0':['01110','10011','10101','11001','01110'],
  '1':['010','110','010','010','111'],
  '2':['01110','10001','00110','01000','11111'],
  '3':['11110','00001','01110','00001','11110'],
  '4':['10001','10001','11111','00001','00001'],
  '5':['11111','10000','11110','00001','11110'],
  '6':['01110','10000','11110','10001','01110'],
  '7':['11111','00001','00010','00100','00100'],
  '8':['01110','10001','01110','10001','01110'],
  '9':['01110','10001','01111','00001','01110'],
  ' ':['000','000','000','000','000'],
  '-':['0000','0000','1111','0000','0000'],
  '_':['00000','00000','00000','00000','11111'],
  '.':['0','0','0','0','1'],
  '!':['1','1','1','0','1'],
  '?':['110','001','010','000','010'],
  '#':['01010','11111','01010','11111','01010'],
  '@':['01110','10001','10111','10110','01111'],
  '+':['000','010','111','010','000'],
  '*':['00000','10101','01110','10101','00000'],
  '/':['00001','00010','00100','01000','10000'],
  ':':['0','1','0','1','0'],
  '<':['001','010','100','010','001'],
  '>':['100','010','001','010','100'],
  '(':['010','100','100','100','010'],
  ')':['010','001','001','001','010'],
  '%':['11001','11010','00100','01011','10011'],
  '&':['0110','1001','0110','1010','0111'],
};


const ICONS = {
  star: {
    label: '★',
    pixels: [
      '00100',
      '11111',
      '01110',
      '01010',
      '10001',
    ]
  },
  shield: {
    label: '🛡',
    pixels: [
      '01110',
      '11111',
      '11111',
      '01110',
      '00100',
    ]
  },
  crown: {
    label: '♛',
    pixels: [
      '10101',
      '10101',
      '11111',
      '11111',
      '01110',
    ]
  },
  fire: {
    label: '🔥',
    pixels: [
      '00100',
      '01110',
      '11111',
      '11111',
      '01110',
    ]
  },
  bolt: {
    label: '⚡',
    pixels: [
      '00110',
      '01100',
      '11110',
      '00110',
      '00100',
    ]
  },
  skull: {
    label: '💀',
    pixels: [
      '01110',
      '10101',
      '11111',
      '01110',
      '01110',
    ]
  },
  check: {
    label: '✓',
    pixels: [
      '00001',
      '00010',
      '10100',
      '01000',
      '00000',
    ]
  },
  cross: {
    label: '✕',
    pixels: [
      '10001',
      '01010',
      '00100',
      '01010',
      '10001',
    ]
  },
  heart: {
    label: '♥',
    pixels: [
      '01010',
      '11111',
      '11111',
      '01110',
      '00100',
    ]
  },
  diamond: {
    label: '♦',
    pixels: [
      '00100',
      '01110',
      '11111',
      '01110',
      '00100',
    ]
  },
  lock: {
    label: '🔒',
    pixels: [
      '01110',
      '10001',
      '11111',
      '11011',
      '11111',
    ]
  },
  sword: {
    label: '⚔',
    pixels: [
      '00001',
      '00010',
      '00100',
      '01110',
      '11100',
    ]
  },
};

let gradDir = 'top-bottom';
let selectedIcon = null;
let iconPos = 'left';

const PRESETS = [
  { a: '#ff3333', b: '#cc0000', s: '#5e0000' },
  { a: '#ff8800', b: '#cc5500', s: '#5e2200' },
  { a: '#ffcc00', b: '#cc9900', s: '#5e4400' },
  { a: '#33cc33', b: '#007700', s: '#003300' },
  { a: '#00bbff', b: '#0055cc', s: '#002255' },
  { a: '#aa44ff', b: '#6600cc', s: '#2a0055' },
  { a: '#ff44aa', b: '#cc0077', s: '#550033' },
  { a: '#ffffff', b: '#aaaaaa', s: '#444444' },
  { a: '#444444', b: '#111111', s: '#000000' },
  { a: '#00ffcc', b: '#007755', s: '#003322' },
  { a: '#ff5599', b: '#aa0044', s: '#440011' },
  { a: '#ffaa33', b: '#884400', s: '#3a1a00' },
];


const canvas = document.getElementById('badge-canvas');
const ctx = canvas.getContext('2d');
const strip = document.getElementById('gradient-strip');
const stripCtx = strip.getContext('2d');


function hexToRgb(hex) {
  let b = parseInt(hex.substring(1), 16);
  return { r: (b>>16)&255, g: (b>>8)&255, b: b&255 };
}

function setDir(d, btn) {
  gradDir = d;
  document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawBadge();
}

function setIconPos(pos, btn) {
  iconPos = pos;
  document.querySelectorAll('.icon-pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawBadge();
}

function selectIcon(key, btn) {
  selectedIcon = key;
  document.querySelectorAll('.icon-btn, .icon-none-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const posToggle = document.getElementById('icon-pos-toggle');
  posToggle.style.display = key ? 'flex' : 'none';
  drawBadge();
}

function buildIconPicker() {
  const picker = document.getElementById('icon-picker');
  Object.entries(ICONS).forEach(([key, icon]) => {
    const btn = document.createElement('div');
    btn.className = 'icon-btn';
    btn.title = key;

    const mc = document.createElement('canvas');
    mc.width = 5;
    mc.height = 5;
    const mctx = mc.getContext('2d');
    mctx.fillStyle = '#ff3333';
    icon.pixels.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] === '1') mctx.fillRect(x, y, 1, 1);
      }
    });
    btn.appendChild(mc);

    btn.addEventListener('click', () => selectIcon(key, btn));
    picker.appendChild(btn);
  });
}


function getTextWidth(text) {
  let w = 0;
  for (let i = 0; i < text.length; i++) {
    const cd = fontMap[text[i]] || fontMap[' '];
    w += cd[0].length + 1;
  }
  return w > 0 ? w - 1 : 0;
}

function drawBadge() {
  let text = document.getElementById('text-input').value.toUpperCase();
  if (!text) text = ' ';

  const padLeft   = parseInt(document.getElementById('pad-left').value);
  const padRight  = parseInt(document.getElementById('pad-right').value);
  const padTop    = parseInt(document.getElementById('pad-top').value);
  const padBottom = parseInt(document.getElementById('pad-bottom').value);

  const textW = getTextWidth(text);

  const iconDef = selectedIcon ? ICONS[selectedIcon] : null;
  const iconW = iconDef ? iconDef.pixels[0].length : 0;
  const iconGap = iconDef ? 2 : 0;

  const contentW = textW + (iconDef ? iconW + iconGap : 0);
  const width  = contentW + padLeft + padRight;
  const height = 5 + padTop + padBottom;

  canvas.width  = width;
  canvas.height = height;

  
  const cTop = hexToRgb(document.getElementById('bg-top').value);
  const cBot = hexToRgb(document.getElementById('bg-bottom').value);

  if (gradDir === 'top-bottom') {
    for (let y = 0; y < height; y++) {
      const r = height > 1 ? y / (height - 1) : 0;
      ctx.fillStyle = `rgb(${Math.round(cTop.r+(cBot.r-cTop.r)*r)},${Math.round(cTop.g+(cBot.g-cTop.g)*r)},${Math.round(cTop.b+(cBot.b-cTop.b)*r)})`;
      ctx.fillRect(0, y, width, 1);
    }
  } else {
    for (let x = 0; x < width; x++) {
      const r = width > 1 ? x / (width - 1) : 0;
      ctx.fillStyle = `rgb(${Math.round(cTop.r+(cBot.r-cTop.r)*r)},${Math.round(cTop.g+(cBot.g-cTop.g)*r)},${Math.round(cTop.b+(cBot.b-cTop.b)*r)})`;
      ctx.fillRect(x, 0, 1, height);
    }
  }

  ctx.clearRect(0, 0, 1, 1);
  ctx.clearRect(width - 1, 0, 1, 1);
  ctx.clearRect(0, height - 1, 1, 1);
  ctx.clearRect(width - 1, height - 1, 1, 1);

  const startY = padTop;
  const txtColor = document.getElementById('text-color').value;
  const shdColor = document.getElementById('shadow-color').value;

  let iconX, textX;
  if (iconDef) {
    if (iconPos === 'left') {
      iconX = padLeft;
      textX = padLeft + iconW + iconGap;
    } else {
      textX = padLeft;
      iconX = padLeft + textW + iconGap;
    }
  } else {
    textX = padLeft;
    iconX = 0;
  }


  function drawIcon(ox, oy, color) {
    if (!iconDef) return;
    ctx.fillStyle = color;
    iconDef.pixels.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] === '1') ctx.fillRect(iconX + x + ox, startY + y + oy, 1, 1);
      }
    });
  }

  function drawText(ox, oy, color) {
    ctx.fillStyle = color;
    let cx = textX;
    for (let i = 0; i < text.length; i++) {
      const cd = fontMap[text[i]] || fontMap[' '];
      for (let y = 0; y < 5; y++)
        for (let x = 0; x < cd[y].length; x++)
          if (cd[y][x] === '1')
            ctx.fillRect(cx + x + ox, startY + y + oy, 1, 1);
      cx += cd[0].length + 1;
    }
  }


  drawIcon(1, 1, shdColor);
  drawText(1, 1, shdColor);
  drawIcon(0, 0, txtColor);
  drawText(0, 0, txtColor);

  document.getElementById('size-info').textContent = `${width} × ${height} px`;
}
function syncColorUI() {
  [
    ['bg-top',       'dot-top-bg', 'hex-top'],
    ['bg-bottom',    'dot-bot-bg', 'hex-bot'],
    ['text-color',   'dot-txt-bg', 'hex-txt'],
    ['shadow-color', 'dot-shd-bg', 'hex-shd'],
  ].forEach(([inputId, dotId, hexId]) => {
    const val = document.getElementById(inputId).value;
    document.getElementById(dotId).style.background = val;
    document.getElementById(hexId).textContent = val.toUpperCase();
  });
  updateStrip();
}

function updateStrip() {
  const w = strip.parentElement.offsetWidth || 260;
  strip.width = w;
  const a = hexToRgb(document.getElementById('bg-top').value);
  const b = hexToRgb(document.getElementById('bg-bottom').value);
  for (let x = 0; x < w; x++) {
    const r = x / (w - 1);
    stripCtx.fillStyle = `rgb(${Math.round(a.r+(b.r-a.r)*r)},${Math.round(a.g+(b.g-a.g)*r)},${Math.round(a.b+(b.b-a.b)*r)})`;
    stripCtx.fillRect(x, 0, 1, 14);
  }
}

const bar = document.getElementById('presets-bar');
PRESETS.forEach((p, i) => {
  const s = document.createElement('div');
  s.className = 'preset-swatch' + (i === 0 ? ' active' : '');
  s.style.background = `linear-gradient(135deg, ${p.a}, ${p.b})`;
  s.addEventListener('click', () => {
    document.getElementById('bg-top').value = p.a;
    document.getElementById('bg-bottom').value = p.b;
    document.getElementById('shadow-color').value = p.s;
    document.querySelectorAll('.preset-swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    syncColorUI();
    drawBadge();
  });
  bar.appendChild(s);
});

['bg-top', 'bg-bottom', 'text-color', 'shadow-color'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { syncColorUI(); drawBadge(); });
});
document.getElementById('text-input').addEventListener('input', drawBadge);

['pad-left', 'pad-right', 'pad-top', 'pad-bottom'].forEach(id => {
  const slider = document.getElementById(id);
  const valEl  = document.getElementById(id + '-val');
  slider.addEventListener('input', () => { valEl.textContent = slider.value; drawBadge(); });
});

document.getElementById('download-btn').addEventListener('click', () => {
  const name = document.getElementById('text-input').value.trim() || 'badge';
  const a = document.createElement('a');
  a.download = `${name}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
});

buildIconPicker();
syncColorUI();
drawBadge();
</script>
