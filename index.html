<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Generator</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #141416;
    --surface2: #1c1c20;
    --border: #2a2a30;
    --accent: #ff3333;
    --text: #f0f0f0;
    --muted: #666;
    --label: #888;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .sidebar-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex: 1;
  }

  .section-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .text-field {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.15s;
  }
  .text-field:focus { border-color: var(--accent); }

  /* Icon picker */
  .icon-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    position: relative;
    overflow: hidden;
  }
  .icon-btn:hover { border-color: #444; background: #222228; }
  .icon-btn.active { border-color: var(--accent); background: #ff333318; }
  .icon-btn canvas {
    transform: scale(4);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transform-origin: center center;
    pointer-events: none;
  }
  .icon-btn .icon-label {
    font-size: 9px;
    color: var(--muted);
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'Space Mono', monospace;
  }

  .icon-none-btn {
    width: 36px;
    height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--muted);
    transition: all 0.12s;
    font-family: 'Space Mono', monospace;
  }
  .icon-none-btn:hover { border-color: #444; }
  .icon-none-btn.active { border-color: var(--accent); color: var(--accent); background: #ff333318; }

  .icon-pos-toggle {
    display: flex;
    gap: 5px;
    margin-top: 6px;
  }
  .icon-pos-btn {
    flex: 1;
    padding: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--label);
    font-size: 0.72rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.12s;
    font-family: 'DM Sans', sans-serif;
  }
  .icon-pos-btn.active { background: #ff333318; border-color: var(--accent); color: var(--accent); }
  .icon-pos-btn:hover:not(.active) { border-color: #444; color: var(--text); }

  .dir-toggle {
    display: flex;
    gap: 6px;
  }
  .dir-btn {
    flex: 1;
    padding: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--label);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .dir-btn.active { background: #ff333318; border-color: var(--accent); color: var(--accent); }
  .dir-btn:hover:not(.active) { border-color: #444; color: var(--text); }

  .presets-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-swatch {
    width: 32px; height: 32px;
    border-radius: 5px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }
  .preset-swatch:hover { transform: scale(1.1); }
  .preset-swatch.active { border-color: white; }

  .color-section { display: flex; flex-direction: column; gap: 10px; }
  .color-row { display: flex; align-items: center; gap: 10px; }

  .color-dot-wrapper {
    position: relative;
    width: 28px; height: 28px;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid var(--border);
    flex-shrink: 0;
    transition: border-color 0.15s;
  }
  .color-dot-wrapper:hover { border-color: #555; }
  .color-dot-wrapper input[type="color"] {
    position: absolute;
    top: -5px; left: -5px;
    width: 40px; height: 40px;
    border: none; background: none;
    cursor: pointer;
    opacity: 0;
  }
  .color-dot-bg { position: absolute; inset: 0; pointer-events: none; }

  .color-info { flex: 1; display: flex; flex-direction: column; }
  .color-name { font-size: 0.75rem; color: var(--label); }
  
  .color-hex-input {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    width: 90px;
    outline: none;
    text-transform: uppercase;
    transition: border-color 0.15s;
  }
  .color-hex-input:focus {
    border-color: var(--accent);
  }

  .gradient-strip-wrap {
    position: relative;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #gradient-strip { width: 100%; height: 100%; }

  .dl-btn {
    margin-top: auto;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: background 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .dl-btn:hover { background: #cc0000; }
  .dl-btn:active { transform: scale(0.98); }

  #preview-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, #1a1a1e 25%, transparent 25%),
      linear-gradient(-45deg, #1a1a1e 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1a1e 75%),
      linear-gradient(-45deg, transparent 75%, #1a1a1e 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    position: relative;
  }

  .preview-label {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #badge-canvas {
    transform: scale(12);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .size-info {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .divider { width: 100%; height: 1px; background: var(--border); }

  .padding-row { display: flex; align-items: center; gap: 10px; }
  .padding-label {
    font-size: 0.72rem;
    color: var(--label);
    width: 28px;
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
  }
  .padding-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .padding-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
    transition: transform 0.1s;
  }
  .padding-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .padding-slider::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--surface);
  }
  .padding-value {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--text);
    width: 22px;
    text-align: right;
    flex-shrink: 0;
  }
</style>
 </head>
 <body>
  <div id="sidebar">
   <div class="sidebar-body">
    <div>
     <div class="section-label">Badge text</div>
     <input type="text" class="text-field" id="text-input" value="ADMIN" autocomplete="off">
    </div>
    <!-- ICON PICKER -->
    <div>
     <div class="section-label">Pixel icon</div>
     <div class="icon-picker" id="icon-picker">
      <div class="icon-none-btn active" id="icon-none" onclick="selectIcon(null, this)">none</div>
     </div>
     <div class="icon-pos-toggle" id="icon-pos-toggle" style="display:none;">
      <button class="icon-pos-btn active" onclick="setIconPos('left', this)">← Left</button>
      <button class="icon-pos-btn" onclick="setIconPos('right', this)">Right →</button>
     </div>
    </div>
    <div>
     <div class="section-label">Padding</div>
     <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="padding-row">
       <span class="padding-label">L</span> <input type="range" class="padding-slider" id="pad-left" min="1" max="20" value="4"> <span class="padding-value" id="pad-left-val">4</span>
      </div>
      <div class="padding-row">
       <span class="padding-label">R</span> <input type="range" class="padding-slider" id="pad-right" min="1" max="20" value="4"> <span class="padding-value" id="pad-right-val">4</span>
      </div>
      <div class="padding-row">
       <span class="padding-label">T</span> <input type="range" class="padding-slider" id="pad-top" min="0" max="10" value="2"> <span class="padding-value" id="pad-top-val">2</span>
      </div>
      <div class="padding-row">
       <span class="padding-label">B</span> <input type="range" class="padding-slider" id="pad-bottom" min="0" max="10" value="2"> <span class="padding-value" id="pad-bottom-val">2</span>
      </div>
     </div>
    </div>
    <div>
     <div class="section-label">Gradient direction</div>
     <div class="dir-toggle">
      <button class="dir-btn active" id="dir-tb" onclick="setDir('top-bottom', this)">↕ Horizontal</button>
      <button class="dir-btn" id="dir-lr" onclick="setDir('left-right', this)">↔ Vertical</button>
     </div>
    </div>
    <div>
     <div class="section-label">Gradient presets</div>
     <div class="presets-bar" id="presets-bar"></div>
    </div>
    <div>
     <div class="section-label">Gradient preview</div>
     <div class="gradient-strip-wrap">
      <canvas id="gradient-strip" height="14"></canvas>
     </div>
    </div>
    <div class="color-section">
     <div class="section-label">Colors</div>
     <div class="color-row">
      <div class="color-dot-wrapper">
       <div class="color-dot-bg" id="dot-top-bg"></div>
       <input type="color" id="bg-top" value="#ff3333">
      </div>
      <div class="color-info">
       <span class="color-name">Background — Start</span>
       <input type="text" class="color-hex-input" id="hex-top" value="#FF3333" maxlength="7">
      </div>
     </div>
     <div class="color-row">
      <div class="color-dot-wrapper">
       <div class="color-dot-bg" id="dot-bot-bg"></div>
       <input type="color" id="bg-bottom" value="#cc0000">
      </div>
      <div class="color-info">
       <span class="color-name">Background — End</span>
       <input type="text" class="color-hex-input" id="hex-bot" value="#CC0000" maxlength="7">
      </div>
     </div>
     <div class="divider"></div>
     <div class="color-row">
      <div class="color-dot-wrapper">
       <div class="color-dot-bg" id="dot-txt-bg"></div>
       <input type="color" id="text-color" value="#ffffff">
      </div>
      <div class="color-info">
       <span class="color-name">Text</span>
       <input type="text" class="color-hex-input" id="hex-txt" value="#FFFFFF" maxlength="7">
      </div>
     </div>
     <div class="color-row">
      <div class="color-dot-wrapper">
       <div class="color-dot-bg" id="dot-shd-bg"></div>
       <input type="color" id="shadow-color" value="#5e0000">
      </div>
      <div class="color-info">
       <span class="color-name">Text shadow</span>
       <input type="text" class="color-hex-input" id="hex-shd" value="#5E0000" maxlength="7">
      </div>
     </div>
    </div>
    <button class="dl-btn" id="download-btn">↓ Download PNG</button>
   </div>
  </div>
  <div id="preview-area">
   <span class="preview-label">Preview · 12× scale</span>
   <canvas id="badge-canvas"></canvas>
   <span class="size-info" id="size-info">— × — px</span>
  </div>
  <script>
const fontMap = {

  'A':['01110','10001','11111','10001','10001'],
  'B':['11110','10001','11110','10001','11110'],
  'C':['01110','10001','10000','10001','01110'],

const ICONS = {

let gradDir = 'top-bottom';
let selectedIcon = null;
let iconPos = 'left';

const PRESETS = [
  { a: '#ff3333', b: '#cc0000', s: '#5e0000' },
  { a: '#ff8800', b: '#cc5500', s: '#5e2200' },
  { a: '#ffcc00', b: '#cc9900', s: '#5e4400' },
  { a: '#33cc33', b: '#007700', s: '#003300' },
  { a: '#00bbff', b: '#0055cc', s: '#002255' },
  { a: '#aa44ff', b: '#6600cc', s: '#2a0055' },
  { a: '#ff44aa', b: '#cc0077', s: '#550033' },
  { a: '#ffffff', b: '#aaaaaa', s: '#444444' },
  { a: '#444444', b: '#111111', s: '#000000' },
  { a: '#00ffcc', b: '#007755', s: '#003322' },

  { a: '#ffaa33', b: '#884400', s: '#3a1a00' },
];


const canvas = document.getElementById('badge-canvas');
const ctx = canvas.getContext('2d');
const strip = document.getElementById('gradient-strip');
const stripCtx = strip.getContext('2d');


function hexToRgb(hex) {
  let b = parseInt(hex.substring(1), 16);
  return { r: (b>>16)&255, g: (b>>8)&255, b: b&255 };
}

function setDir(d, btn) {
  gradDir = d;
  document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawBadge();
}

function setIconPos(pos, btn) {
  iconPos = pos;
  document.querySelectorAll('.icon-pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawBadge();
}

function selectIcon(key, btn) {
  selectedIcon = key;
  document.querySelectorAll('.icon-btn, .icon-none-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const posToggle = document.getElementById('icon-pos-toggle');
  posToggle.style.display = key ? 'flex' : 'none';
  drawBadge();
}

function buildIconPicker() {
  const picker = document.getElementById('icon-picker');
  Object.entries(ICONS).forEach(([key, icon]) => {
    const btn = document.createElement('div');
    btn.className = 'icon-btn';
    btn.title = key;

    const mc = document.createElement('canvas');
    mc.width = 5;
    mc.height = 5;
    const mctx = mc.getContext('2d');
    mctx.fillStyle = '#ff3333';
    icon.pixels.forEach((row, y) => {
      for (let x = 0; x < row.length; x
